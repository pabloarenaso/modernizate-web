# /etc/apache2/sites-available/00-modernizate-web.conf — HTTP de agmodernizate.cl y www: todo a https://agmodernizate.cl (301).
# El prefijo 00- lo carga antes que 000-default.conf, que por el nombre de la máquina también atiende agmodernizate.cl
# (autorizado por Pablo el 2026-11-25). Efecto: quien entre por IP en el puerto 80 también va al sitio.
# El 443 está en modernizate-web-le-ssl.conf (certbot).
<VirtualHost *:80>
    ServerName agmodernizate.cl
    ServerAlias www.agmodernizate.cl
    Redirect permanent / https://agmodernizate.cl/
</VirtualHost>
