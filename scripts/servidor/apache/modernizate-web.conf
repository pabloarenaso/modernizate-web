# /etc/apache2/sites-available/modernizate-web.conf — sitio HTTP de agmodernizate.cl y www.
# certbot --apache crea después modernizate-web-le-ssl.conf (443) y la redirección a HTTPS.
<VirtualHost *:80>
    ServerName agmodernizate.cl
    ServerAlias www.agmodernizate.cl
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    ProxyPass "/" "http://127.0.0.1:3200/"
    ProxyPassReverse "/" "http://127.0.0.1:3200/"
</VirtualHost>
