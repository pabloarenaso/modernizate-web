# Líneas que se agregan dentro de <VirtualHost *:443> de modernizate-web-le-ssl.conf, después de certbot.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # www → raíz (301)
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.agmodernizate\.cl$ [NC]
    RewriteRule ^ https://agmodernizate.cl%{REQUEST_URI} [L,R=301]
